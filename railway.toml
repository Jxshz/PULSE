# This tells Railway to use its normal auto-detected builder for this repo.
[build]
builder = "RAILPACK"

# This tells Railway exactly how to start the web app and how to check it is healthy.
[deploy]
startCommand = "gunicorn app:app --bind 0.0.0.0:$PORT"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
